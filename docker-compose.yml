version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: snu-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: snu-routine-generator
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - snu-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snu-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/snu-routine-generator?authSource=admin
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - snu-network
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snu-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    depends_on:
      - backend
    networks:
      - snu-network

volumes:
  mongodb_data:
    driver: local

networks:
  snu-network:
    driver: bridge
